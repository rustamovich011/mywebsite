<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshlar — Kelajak Bunyodkorlari</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, #0f3d2e 0%, #145c46 35%, #0e5c78 70%, #0a3550 100%);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 1;
  }
  .glow-green {
    width: 480px;
    height: 480px;
    background: #4caf50;
    top: -160px;
    left: -140px;
    animation: driftGreen 14s ease-in-out infinite;
  }
  .glow-blue {
    width: 520px;
    height: 520px;
    background: #2196c9;
    bottom: -200px;
    right: -160px;
    animation: driftBlue 18s ease-in-out infinite;
  }

  @keyframes driftGreen {
    0%   { transform: translateY(0) translateX(0); }
    50%  { transform: translateY(160px) translateX(30px); }
    100% { transform: translateY(0) translateX(0); }
  }

  @keyframes driftBlue {
    0%   { transform: translateY(0) translateX(0); }
    50%  { transform: translateY(-140px) translateX(-25px); }
    100% { transform: translateY(0) translateX(0); }
  }

  /* ============================================
     RASMLAR LENTASI (marquee)
     ============================================ */

  .marquee-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .marquee-row {
    display: flex;
    gap: 18px;
    width: max-content;
    opacity: 1;
  }

  .marquee-row + .marquee-row {
    margin-top: 18px;
  }

  .marquee-item {
    width: 220px;
    height: 140px;
    border-radius: 16px;
    flex-shrink: 0;
  }

  .marquee-item:nth-child(4n+1) { background: #2f9e63; }
  .marquee-item:nth-child(4n+2) { background: #1f8fb8; }
  .marquee-item:nth-child(4n+3) { background: #4caf50; }
  .marquee-item:nth-child(4n+4) { background: #2196c9; }

  .marquee-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
    display: block;
  }

  .marquee-left {
    animation: scrollLeft 40s linear infinite;
  }

  .marquee-right {
    animation: scrollRight 46s linear infinite;
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @keyframes scrollRight {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(160deg,
      rgba(15, 61, 46, 0.88) 0%,
      rgba(20, 92, 70, 0.85) 35%,
      rgba(14, 92, 120, 0.85) 70%,
      rgba(10, 53, 80, 0.9) 100%);
  }

  /* --- TIL TANLASH TUGMALARI --- */
  .lang-switch {
    position: absolute;
    top: 22px;
    right: 24px;
    z-index: 3;
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    padding: 4px;
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: #eafff4;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .lang-btn.active {
    background: #ffffff;
    color: #0e5c78;
  }

  @media (max-width: 480px) {
    .lang-switch { top: 14px; right: 14px; }
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 24px;
    max-width: 640px;
  }

  .logo-wrap {
    width: 132px;
    height: 132px;
    background: #f4f4f2;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transform: translateY(40px);
    animation: floatUp 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    overflow: hidden;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .eyebrow {
    margin-top: 28px;
    color: #a9e8c9;
    letter-spacing: 0.04em;
    font-size: 15px;
    font-weight: 600;
    opacity: 0;
    animation: fadeIn 0.7s ease-out forwards;
    animation-delay: 0.45s;
  }

  h1 {
    margin: 10px 0 0;
    font-size: 40px;
    line-height: 1.15;
    font-weight: 800;
    color: #ffffff;
    opacity: 0;
    animation: fadeIn 0.7s ease-out forwards;
    animation-delay: 0.55s;
  }

  h1 span {
    background: linear-gradient(90deg, #7be0a8, #6fd3f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 16px 0 0;
    color: #cfe9de;
    font-size: 16px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 0.7s ease-out forwards;
    animation-delay: 0.65s;
  }

  .meta {
    display: flex;
    gap: 24px;
    margin-top: 22px;
    color: #bfe3d4;
    font-size: 14px;
    opacity: 0;
    animation: fadeIn 0.7s ease-out forwards;
    animation-delay: 0.75s;
  }

  .meta span {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    margin-top: 34px;
    opacity: 0;
    animation: fadeIn 0.7s ease-out forwards;
    animation-delay: 0.9s;
  }

  button {
    padding: 15px 35px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .btn-primary {
    background: linear-gradient(90deg, #2f9e63, #1f8fb8);
    color: white;
    box-shadow: 0 10px 24px rgba(31, 143, 184, 0.35);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(31, 143, 184, 0.45);
  }

  @keyframes floatUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    h1 { font-size: 30px; }
    .buttons { width: 100%; }
    button { width: 100%; }
    .meta { flex-direction: column; gap: 8px; align-items: center; }
  }
</style>

  <script>
    document.querySelector('[data-key="gallery"]').addEventListener('click', function() {
      window.location.href = 'gallery.html'; // Galereya sahifasi manzili
    });

    const translations = {
      uz: {
        eyebrow: "Yoshlar — kelajak bunyodkorlari",
        title: 'V Ekologiya va turizm <span>xalqaro qurultoyi</span>',
        subtitle: "Yoshlarni ekologiya, barqaror turizm va volontyorlik faoliyatida birlashtiruvchi yillik forum.",
        location: "Shahrisabz, Qashqadaryo",
        gallery: "Galereya"
      },
      ru: {
        eyebrow: "Молодёжь — строители будущего",
        title: 'V Международный съезд по <span>экологии и туризму</span>',
        subtitle: "Ежегодный форум, объединяющий молодёжь в сфере экологии, устойчивого туризма и волонтёрства.",
        location: "Шахрисабз, Кашкадарья",
        gallery: "Галерея"
      },
      en: {
        eyebrow: "Youth — Builders of the Future",
        title: 'V International Ecology and <span>Tourism Congress</span>',
        subtitle: "An annual forum bringing young people together around ecology, sustainable tourism, and volunteering.",
        location: "Shahrisabz, Qashqadaryo",
        gallery: "Gallery"
      }
    };

    function setLanguage(lang) {
      const dict = translations[lang];

      document.querySelectorAll('[data-key]').forEach(function (el) {
        const key = el.getAttribute('data-key');
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });

      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      document.documentElement.lang = lang;
    }

    document.querySelectorAll('.lang-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setLanguage(btn.getAttribute('data-lang'));
      });
    });
  </script>
